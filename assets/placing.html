<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Final Placings</title>
		<link rel="stylesheet" href="../style.css">
	</head>
	<body class="placing-page">
		<main class="placing-shell">
			<header class="placing-header">
				<p class="eyebrow">Final placings</p>
				<h1>The Winners</h1>
				<p class="intro">Your ranking is locked in. Here are the top three.</p>
			</header>
			<section id="podium" class="podium" aria-label="Top three heroes"></section>
			<div class="placing-actions">
				<button id="rank-again" class="start-button" type="button">Rank again <span aria-hidden="true">&#8635;</span></button>
				<a class="text-link" href="../main.html">Back to start</a>
			</div>
			<section class="history-section" aria-labelledby="history-title">
				<h2 id="history-title">Past winners</h2>
				<ul id="history-list" class="history-list"></ul>
			</section>
		</main>
		<script src="game.js"></script>
		<script>
			const ranking = heroGame.getRanking();
			const podium = document.querySelector('#podium');
			const positions = [
				{ className: 'podium-second', label: '2nd' },
				{ className: 'podium-first', label: 'Champion' },
				{ className: 'podium-third', label: '3rd' }
			];
			const podiumRanking = [ranking[1], ranking[0], ranking[2]].filter(Boolean);

			podiumRanking.forEach((hero, index) => {
				const position = positions[index];
				const card = document.createElement('article');
				card.className = `podium-place ${position.className}`;
				card.innerHTML = `<div class="podium-hero"><img src="${hero.file}" alt="${hero.name}"><strong>${hero.name}</strong><span>${hero.score} points</span></div><div class="podium-stand"><b>${position.label}</b></div>`;
				podium.appendChild(card);
			});

			if (!podiumRanking.length) {
				podium.innerHTML = '<p class="empty-state">No finished ranking yet. Build your roster first.</p>';
			}

			document.querySelector('#rank-again').addEventListener('click', () => {
				heroGame.resetRanking();
				window.location.href = 'rank.html';
			});

			const historyList = document.querySelector('#history-list');
			heroGame.getHistory().slice(0, 5).forEach((match) => {
				const item = document.createElement('li');
				const date = new Date(match.timestamp).toLocaleString();
				const winners = match.topThree.map((hero) => `${hero.name} (${hero.score})`).join(' · ');
				item.innerHTML = `<time datetime="${match.timestamp}">${date}</time><span>${winners}</span>`;
				historyList.appendChild(item);
			});
		</script>
	</body>
</html>
