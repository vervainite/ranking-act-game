<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Rank Your Heroes</title>
		<link rel="stylesheet" href="../style.css">
	</head>
	<body class="ranking-page">
		<main class="ranking-shell">
			<header class="ranking-header">
				<a class="back-link" href="../main.html" aria-label="Back to start">&#8592; Back</a>
				<div>
					<p class="eyebrow">Power tier list</p>
					<h1>RANKING</h1>
					<p class="intro">Give each Monster a score and watch the baddest take the top spot.</p>
				</div>
				<div class="hero-controls">
					<label class="sr-only" for="hero-picker">Choose a hero</label>
					<select id="hero-picker">
						<option value="">Choose a hero</option>
						<option value="aqua">Aqua</option>
						<option value="firecat">Firecat</option>
						<option value="flameo">Flameo</option>
						<option value="mushroom">Mushroom</option>
						<option value="rocky">Rocky</option>
						<option value="slime">Slime</option>
						<option value="yeti">Yeti</option>
					</select>
					<img id="hero-preview" class="hero-preview" alt="" hidden>
					<label class="sr-only" for="hero-name-input">Hero name</label>
					<input id="hero-name-input" class="hero-name-input" type="text" maxlength="24" placeholder="Hero name">
					<button id="add-hero" class="add-hero" type="button" disabled>Add hero</button>
				</div>
			</header>

			<section class="leaderboard" aria-label="Hero rankings">
				<div class="leaderboard-labels" aria-hidden="true"><span>Rank</span><span>Hero</span><span>Score</span></div>
				<p id="empty-state" class="empty-state">Choose a hero above to start your ranking.</p>
				<div id="hero-list"></div>
				<button id="finish-button" class="finish-button" type="button" disabled>Finish ranking</button>
			</section>
		</main>

		<script src="game.js"></script>
		<script>
			const allHeroes = [
				{ id: 'aqua', name: 'Aqua', file: 'aqua.gif', score: 0, order: 0 },
				{ id: 'firecat', name: 'Firecat', file: 'firecat.gif', score: 0, order: 1 },
				{ id: 'flameo', name: 'Flameo', file: 'flameo.gif', score: 0, order: 2 },
				{ id: 'mushroom', name: 'Mushroom', file: 'mushroom.gif', score: 0, order: 3 },
				{ id: 'rocky', name: 'Rocky', file: 'rocky.gif', score: 0, order: 4 },
				{ id: 'slime', name: 'Slime', file: 'slime.gif', score: 0, order: 5 },
				{ id: 'yeti', name: 'Yeti', file: 'yeti.gif', score: 0, order: 6 }
			];
			const heroes = [];
			const heroList = document.querySelector('#hero-list');
			const emptyState = document.querySelector('#empty-state');
			const heroPicker = document.querySelector('#hero-picker');
			const heroPreview = document.querySelector('#hero-preview');
			const heroNameInput = document.querySelector('#hero-name-input');
			const addHeroButton = document.querySelector('#add-hero');
			const finishButton = document.querySelector('#finish-button');

			function updateHeroChooser() {
				const selectedHero = allHeroes.find((hero) => hero.id === heroPicker.value);
				heroPreview.hidden = !selectedHero;
				heroPreview.src = selectedHero ? selectedHero.file : '';
				heroPreview.alt = selectedHero ? `${selectedHero.name} preview` : '';
				if (selectedHero && !heroNameInput.value) heroNameInput.value = selectedHero.name;
				[...heroPicker.options].forEach((option) => {
					option.disabled = heroes.some((hero) => hero.id === option.value);
				});
				addHeroButton.disabled = !selectedHero || heroes.some((hero) => hero.id === selectedHero.id);
			}

			function renderHeroes(animate = false, activeInput = null) {
				const previousPositions = new Map(
					[...heroList.children].map((element) => [element.dataset.id, element.getBoundingClientRect().top])
				);

				heroes.sort((first, second) => second.score - first.score || first.order - second.order);
				heroes.forEach((hero, index) => {
					let row = heroList.querySelector(`[data-id="${hero.id}"]`);
					if (!row) {
						row = document.createElement('article');
						row.className = 'hero-row';
						row.dataset.id = hero.id;
						row.innerHTML = `<span class="rank-number"></span><div class="hero-info"><img alt="" src="${hero.file}"><span class="hero-name"></span></div><label class="score-field"><span class="sr-only">Score for ${hero.name}</span><input type="number" min="0" inputmode="numeric"></label><button class="remove-hero" type="button" aria-label="Remove ${hero.name}" title="Remove hero">&times;</button>`;
						row.querySelector('input').addEventListener('input', (event) => {
							const value = event.target.value;
							hero.score = value === '' ? 0 : Math.max(0, Number(value) || 0);
						});
						row.querySelector('input').addEventListener('change', () => {
							renderHeroes(true);
						});
						row.querySelector('.remove-hero').addEventListener('click', () => {
							const heroIndex = heroes.indexOf(hero);
							if (heroIndex !== -1) heroes.splice(heroIndex, 1);
							renderHeroes(true);
						});
					}
					row.querySelector('.rank-number').textContent = String(index + 1).padStart(2, '0');
					row.querySelector('.hero-name').textContent = hero.name;
					const input = row.querySelector('input');
					if (input !== activeInput) input.value = hero.score || '';
					heroList.appendChild(row);
				});
				[...heroList.children].forEach((row) => {
					if (!heroes.some((hero) => hero.id === row.dataset.id)) row.remove();
				});
				emptyState.hidden = heroes.length > 0;
				updateHeroChooser();
				finishButton.disabled = heroes.length === 0;

				if (!animate) return;
				[...heroList.children].forEach((row) => {
					const oldTop = previousPositions.get(row.dataset.id);
					if (oldTop === undefined) return;
					const offset = oldTop - row.getBoundingClientRect().top;
					if (!offset) return;
					row.animate([{ transform: `translateY(${offset}px)` }, { transform: 'translateY(0)' }], { duration: 420, easing: 'cubic-bezier(.22, 1, .36, 1)' });
				});
			}

			heroPicker.addEventListener('change', () => {
				heroNameInput.value = '';
				updateHeroChooser();
			});

			addHeroButton.addEventListener('click', () => {
				const selectedHero = allHeroes.find((hero) => hero.id === heroPicker.value);
				if (!selectedHero || heroes.some((hero) => hero.id === selectedHero.id)) return;
				heroes.push({ ...selectedHero, name: heroNameInput.value.trim() || selectedHero.name, score: 0 });
				heroPicker.value = '';
				heroNameInput.value = '';
				renderHeroes(true);
			});

			finishButton.addEventListener('click', () => {
				const finalRanking = heroes
					.slice()
					.sort((first, second) => second.score - first.score || first.order - second.order)
					.map(({ id, name, file, score, order }) => ({ id, name, file, score, order }));
				heroGame.saveFinishedMatch(finalRanking);
				window.location.href = 'placing.html';
			});

			renderHeroes();
		</script>
	</body>
</html>
